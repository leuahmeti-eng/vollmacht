<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vollmacht</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vollmacht">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0B2238">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #eef1f5; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  .box { max-width: 420px; margin: 0 auto; padding: 48px 24px; text-align: center; color: #0B2238; }
  .box img { width: 96px; height: 96px; border-radius: 22px; }
  .box h1 { font-size: 24px; margin: 16px 0 8px; }
  .box p { color: #4a5563; line-height: 1.5; font-size: 16px; }
</style>
</head>
<body>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbz9Vz2ziuUE6_1AXB3qqJYE3ySr4o_PGg5EdGpGn2jKmlZ9Qrd69gVaLkSXWpo4UqQijw/exec';
  var key = (location.hash || '').replace('#', '');
  try {
    if (/^[a-f0-9]{64}$/.test(key)) localStorage.setItem('vollmacht_key', key);
    else key = localStorage.getItem('vollmacht_key') || '';
  } catch (e) {}
  if (/^[a-f0-9]{64}$/.test(key)) {
    var f = document.createElement('iframe');
    f.src = APP + '?admin=' + key;
    f.title = 'Vollmacht';
    f.allow = 'clipboard-write';
    document.body.appendChild(f);
  } else {
    var d = document.createElement('div');
    d.className = 'box';
    var img = document.createElement('img'); img.src = 'icon-192.png'; img.alt = '';
    var h = document.createElement('h1'); h.textContent = 'Vollmacht';
    var p = document.createElement('p'); p.textContent = 'Bitte öffne diese Seite einmal über deinen persönlichen Einrichtungslink.';
    d.appendChild(img); d.appendChild(h); d.appendChild(p);
    document.body.appendChild(d);
  }
</script>
</body>
</html>
